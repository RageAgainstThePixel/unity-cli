name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        run: |
          major=$(npm --version | cut -d. -f1)
          minor=$(npm --version | cut -d. -f2)
          patch=$(npm --version | cut -d. -f3)
          if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 5 ]; } || { [ "$major" -eq 11 ] && [ "$minor" -eq 5 ] && [ "$patch" -lt 1 ]; }; then
            npm install -g npm@latest
          fi
      - name: Build and publish
        run: |
          npm i
          npm run build
          lastVersion=$(npm show @rage-against-the-pixel/unity-cli version)
          version=$(node -p "require('./package.json').version")
          if [ "$version" = "$lastVersion" ]; then
            echo "No changes detected"
            exit 0
          fi
          npm publish --access public
