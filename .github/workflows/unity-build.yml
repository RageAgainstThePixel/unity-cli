name: unity-build
on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      utp-test-profile:
        required: false
        type: string
        default: normal
      allow-security-alert:
        description: Opt in to editors with a Unity Security Alert, for the legacy editor set that tests them on purpose.
        required: false
        type: boolean
        default: false
    secrets:
      UNITY_USERNAME:
        required: true
      UNITY_PASSWORD:
        required: true
      CI_TOKEN:
        description: Keys the encrypted run license that macOS and Linux rows activate from.
        required: false
jobs:
  build:
    # rows are grouped by editor version, so the name carries the OS and target
    name: ${{ matrix.os }} ${{ matrix.build-target }} ${{ matrix.build-args }}
    runs-on: ${{ matrix.os }}
    # a hung editor or licensing call must not hold the matrix; Android rows build a player through Gradle and get more
    timeout-minutes: ${{ matrix.build-target == 'Android' && 60 || 45 }}
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
      fail-fast: false
    permissions:
      contents: read
      checks: write # to publish unit test results via checks github api
    defaults:
      run:
        shell: bash
    env:
      UNITY_PROJECT_PATH: '' # Create Unity Project step will set this if needed
      UNITY_CLI_WORKFLOW_SUMMARY: 'true' # opt-in: append rich markdown to GITHUB_STEP_SUMMARY from unity-cli log parsing
      # read by setup-unity and run; empty for the Unity 6 and newer rows, which must stay unlabelled
      UNITY_ALLOW_SECURITY_ALERT: ${{ inputs.allow-security-alert && '1' || '' }}
      # matrix values reach run scripts through the environment, never by expression interpolation
      MATRIX_OS: ${{ matrix.os }}
      MATRIX_UNITY_VERSION: ${{ matrix.unity-version }}
      MATRIX_BUILD_TARGET: ${{ matrix.build-target }}
      MATRIX_BUILD_ARGS: ${{ matrix.build-args }}
      MATRIX_CHANNEL: ${{ matrix.channel }}
      MATRIX_CHANGESET: ${{ matrix.changeset }}
    steps:
      # runs alongside checkout and the unity-cli build; the wait before the editor packages joins it
      - name: Free Disk Space
        id: free-disk-space
        background: true
        if: ${{ matrix.os == 'ubuntu-latest' && (matrix.unity-version != '2018' && matrix.unity-version != '2017.4.40f1') }}
        uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4.0.1
        with:
          remove_android: true
          remove_dotnet: false
          remove_tool_cache: false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Setup unity-cli
        run: |
          npm ci
          npm run build
          npm run link
          unity-cli --version
      # checks setup-unity's security alerts against the live Unity Releases API; nothing here downloads an editor
      - name: Security alert checks
        if: ${{ inputs.utp-test-profile == 'negative' && runner.os == 'Linux' }}
        timeout-minutes: 10
        env:
          # the apt step is not what is under test, and skipping it lets an allowed install reach its download quickly
          UNITY_CLI_LINUX_DEPENDENCIES_INSTALLED: 'true'
        run: |
          set -euo pipefail
          out="$(mktemp)"
          # prints a captured run with workflow commands paused, so its alerts do not become this job's annotations
          show() {
            local token="captured-${RANDOM}${RANDOM}"
            echo "::stop-commands::${token}"
            cat "${out}"
            echo "::${token}::"
          }
          fail() { echo "::error::$1"; show; exit 1; }
          # the whole setup-unity run must stop on the alert, with nothing installed
          expect_blocked() {
            if unity-cli setup-unity "$@" > "${out}" 2>&1; then
              fail "setup-unity $* passed, but its editor has a security alert"
            fi
            grep -q 'title=Unity Security Alert' "${out}" || fail "setup-unity $* did not report a Unity Security Alert"
            # an editor install logs "Installing Unity <version>"; the official CLI's own "Installing Unity CLI" is expected
            ! grep -Eq 'Installing Unity [0-9]' "${out}" || fail "setup-unity $* started an install before stopping on the alert"
          }
          # runs setup-unity in its own process group until it starts installing, then stops it before the download
          run_until_install() {
            local version="$1"
            setsid unity-cli setup-unity --unity-version "${version}" > "${out}" 2>&1 &
            local pid=$!
            for _ in $(seq 1 300); do
              if grep -q "Installing Unity ${version}" "${out}" || ! kill -0 "${pid}" 2> /dev/null; then
                break
              fi
              sleep 1
            done
            # unity-cli stops the official CLI's install when it gets SIGTERM; anything left after that is killed
            kill -TERM -- "-${pid}" 2> /dev/null || true
            for _ in $(seq 1 60); do
              kill -0 "${pid}" 2> /dev/null || break
              sleep 1
            done
            kill -KILL -- "-${pid}" 2> /dev/null || true
            pkill -KILL -f 'unity install' 2> /dev/null || true
            wait "${pid}" 2> /dev/null || true
            grep -q "Installing Unity ${version}" "${out}" || fail "setup-unity ${version} did not reach its install"
          }

          echo "::group::2022.3.62f1 without the opt-in"
          expect_blocked --unity-version 2022.3.62f1
          grep -q 'https://unity.com/security/sept-2025-01' "${out}" || fail 'the alert did not name the advisory'
          grep -Eq 'Patched: 2022\.3\.[0-9]+f[0-9]+' "${out}" || fail 'the alert did not name a patched release'
          grep -q 'To continue, re-run: unity-cli setup-unity --unity-version 2022.3.62f1 --allow-security-alert (or set UNITY_ALLOW_SECURITY_ALERT=1)' "${out}" || fail 'the alert did not show the command to re-run with the opt-in'
          show
          echo "::endgroup::"

          echo "::group::run on a 2022.3.62f1 project without the opt-in"
          project="$(mktemp -d)"
          mkdir -p "${project}/ProjectSettings"
          echo 'm_EditorVersion: 2022.3.62f1' > "${project}/ProjectSettings/ProjectVersion.txt"
          if env -u UNITY_EDITOR_PATH unity-cli run --unity-project "${project}" -quit > "${out}" 2>&1; then
            fail 'run passed on a project whose editor has a security alert'
          fi
          grep -q 'title=Unity Security Alert' "${out}" || fail 'run did not report a Unity Security Alert'
          grep -q -- '-quit --allow-security-alert (or set UNITY_ALLOW_SECURITY_ALERT=1)' "${out}" || fail 'run did not show the command to re-run with the opt-in'
          ! grep -Eq 'Installing Unity [0-9]' "${out}" || fail 'run started an install before stopping on the alert'
          show
          echo "::endgroup::"

          echo "::group::5.6.2f1 without the opt-in"
          expect_blocked --unity-version 5.6.2f1 --changeset 0000000000ab
          grep -q 'CVE-2017-12939' "${out}" || fail 'the 5.x alert did not list CVE-2017-12939'
          grep -q 'CVE-2019-9197' "${out}" || fail 'the 5.x alert did not list CVE-2019-9197'
          show
          echo "::endgroup::"

          echo "::group::2022.3.62f1 with UNITY_ALLOW_SECURITY_ALERT=1"
          export UNITY_ALLOW_SECURITY_ALERT=1
          run_until_install 2022.3.62f1
          unset UNITY_ALLOW_SECURITY_ALERT
          grep -q '::warning title=Unity Security Alert' "${out}" || fail 'the allowed alert was not a warning'
          ! grep -q '::error title=Unity Security Alert' "${out}" || fail 'the allowed alert was still an error'
          show
          echo "::endgroup::"

          echo "::group::2022.3.62f3, which has no alert"
          run_until_install 2022.3.62f3
          ! grep -q 'Security Alert' "${out}" || fail 'an unlabelled release reported a security alert'
          show
          echo "::endgroup::"
      - name: Wait for Free Disk Space
        wait: free-disk-space
      # the editor's apt packages come from a mirror that has served them at about 40 kB/s, so the .deb files are kept
      # in the Actions cache: an apt hook copies every package dpkg installs, and a later run puts them back into apt's
      # archive before setup-unity, so apt finds them already downloaded
      - name: Restore Linux editor packages
        id: linux-packages
        if: ${{ runner.os == 'Linux' && matrix.unity-version != 'none' }}
        run: |
          echo "key=unity-linux-packages-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
          echo "restore-key=unity-linux-packages-${ImageOS}-" >> "$GITHUB_OUTPUT"
          mkdir -p "${RUNNER_TEMP}/apt-packages"
          echo "DPkg::Pre-Install-Pkgs {\"xargs -r cp -n -t ${RUNNER_TEMP}/apt-packages/ || true\";};" | sudo tee /etc/apt/apt.conf.d/99unity-cli-keep-packages > /dev/null
      - uses: actions/cache/restore@v6
        id: linux-packages-cache
        if: ${{ steps.linux-packages.outcome == 'success' }}
        with:
          path: ${{ runner.temp }}/apt-packages
          key: ${{ steps.linux-packages.outputs.key }}
          restore-keys: ${{ steps.linux-packages.outputs.restore-key }}
      - name: Seed apt with cached packages
        if: ${{ steps.linux-packages-cache.outputs.cache-matched-key != '' }}
        run: |
          count=$(find "${RUNNER_TEMP}/apt-packages" -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')
          echo "Restored ${count} cached packages"
          if [ "${count}" -gt 0 ]; then
            sudo cp -n "${RUNNER_TEMP}"/apt-packages/*.deb /var/cache/apt/archives/
          fi
      - name: Setup Unity
        timeout-minutes: 30
        run: |
          unity-cli upm-install --json
          UPM_VER=$(unity-cli upm-version | tr -d '\n\r')
          echo "UPM CLI version: ${UPM_VER}"
          if ! [[ "${UPM_VER}" =~ ^v[0-9] ]]; then
            echo "::error::upm-version expected a v-prefixed release (e.g. v9.0.0); got: ${UPM_VER}"
            exit 1
          fi
          if [ "${MATRIX_UNITY_VERSION}" = "none" ]; then
            # the official CLI installs on first use; license-context needs it and no editor
            unity-cli license-context
          else
            setup_cmd=(
              unity-cli setup-unity
              --unity-version "${MATRIX_UNITY_VERSION}"
              --build-targets "${MATRIX_BUILD_TARGET}"
              --json
            )
            # each row tests the newest build of its stream: a final release still wins once the stream has one,
            # while streams that only have betas or alphas so far (such as 6000.7 and 7000.0) resolve to those
            CHANNEL="${MATRIX_CHANNEL:-f,b,a}"
            CHANGESET="${MATRIX_CHANGESET}"
            if [ -n "${CHANNEL}" ]; then
              setup_cmd+=(--channel "${CHANNEL}")
            fi
            if [ -n "${CHANGESET}" ]; then
              setup_cmd+=(--changeset "${CHANGESET}")
            fi
            "${setup_cmd[@]}"
          fi
      - name: Collect Linux editor packages
        id: linux-packages-collect
        if: ${{ steps.linux-packages.outcome == 'success' && steps.linux-packages-cache.outputs.cache-hit != 'true' }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/apt-packages"
          count=$(find "${RUNNER_TEMP}/apt-packages" -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')
          echo "Collected ${count} packages"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v6
        # rows run in parallel, so several may try the same key; the first save wins and the rest only warn
        if: ${{ steps.linux-packages-collect.outputs.count > 0 }}
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/apt-packages
          key: ${{ steps.linux-packages.outputs.key }}
      - name: Verify UNITY_CLI_PATH and UNITY_EDITOR_PATH variables
        run: |
          echo "UNITY_CLI_PATH: ${UNITY_CLI_PATH}"
          echo "UNITY_CLI_VERSION: ${UNITY_CLI_VERSION:-}"
          echo "UNITY_EDITOR_PATH: ${UNITY_EDITOR_PATH}"
          echo "UNITY_PROJECT_PATH: ${UNITY_PROJECT_PATH}" # Expected to be empty at this point
          echo "UNITY_EDITOR_VERSION: ${UNITY_EDITOR_VERSION:-}"
          echo "UNITY_EDITOR_CHANGESET: ${UNITY_EDITOR_CHANGESET:-}"
          echo "UNITY_EDITOR_CHANNELS: ${UNITY_EDITOR_CHANNELS:-}"

          if [ -z "${UNITY_CLI_PATH}" ]; then
            echo "::error::UNITY_CLI_PATH is not set"
            exit 1
          fi
          unity --version

          if [ "${MATRIX_UNITY_VERSION}" != "none" ] && [ -z "${UNITY_EDITOR_PATH}" ]; then
            echo "::error::UNITY_EDITOR_PATH is not set"
            exit 1
          fi

          if [ "${MATRIX_UNITY_VERSION}" != "none" ]; then
            {
              echo "### Resolved Unity editor"
              echo ""
              echo "- version: \`${UNITY_EDITOR_VERSION:-n/a}\`"
              echo "- changeset: \`${UNITY_EDITOR_CHANGESET:-n/a}\`"
              echo "- channels: \`${UNITY_EDITOR_CHANNELS:-f}\`"
              echo "- path: \`${UNITY_EDITOR_PATH:-n/a}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # macOS and Linux runners all report the same machine identity to Unity, so the license the caller's license job
      # activated once for this run serves every macOS or Linux row; it arrives as an encrypted artifact and is never
      # returned. Without it, or when it no longer fits this machine, the row activates with the account. Windows runners
      # are a new machine every job, so Windows rows activate with the account and return the license.
      - name: Download run license
        id: download-run-license
        if: ${{ runner.os != 'Windows' && matrix.unity-version != 'none' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: unity-license-${{ runner.os }}
          path: ${{ runner.temp }}/unity-license
      - name: Decrypt run license
        id: run-license
        if: ${{ steps.download-run-license.outcome == 'success' }}
        continue-on-error: true
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/unity-license"
          license="${dir}/Unity_lic.ulf"
          # the key never reaches a command line: openssl reads it from the environment
          export LICENSE_KEY="${CI_TOKEN}:${GITHUB_RUN_ID}"
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "${dir}/unity-license.enc" -out "${license}" -pass env:LICENSE_KEY; then
            echo 'Could not decrypt the run license' >&2
            exit 1
          fi
          echo "path=${license}" >> "${GITHUB_OUTPUT}"
      - name: Activate License
        id: activate-license
        if: ${{ matrix.unity-version != 'none' }}
        env:
          UNITY_LICENSE: ${{ steps.run-license.outputs.path }}
          # read by activate-license from the environment, so the credentials never sit on a command line
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          unity-cli license-context
          major="${UNITY_EDITOR_VERSION%%.*}"
          # 4.x and 5.x editors need their own license version, so they always activate with the account
          if [ "${RUNNER_OS}" = "Windows" ] || [ "${major}" -lt 2017 ]; then
            unset UNITY_LICENSE
          fi
          # activate-license writes license-source=license-file|account to this step's outputs
          unity-cli activate-license --license personal
          rm -rf "${RUNNER_TEMP}/unity-license"
      - name: Create Unity Project
        if: ${{ matrix.unity-version != 'none' }}
        run: |
          project_root="${GITHUB_WORKSPACE}"
          project_path="${project_root}/Unity Project"
          major="${UNITY_EDITOR_VERSION%%.*}"
          # project templates start with 2019; older editors create an empty project
          create_project() {
            if [ "${major}" -ge 2019 ]; then
              arch="x86_64"
              if [ "${RUNNER_ARCH}" = "ARM64" ] && [ "${major}" -ge 2021 ]; then
                arch="arm64"
              fi
              unity projects create "Unity Project" --path "${project_root}" --editor-version "${UNITY_EDITOR_VERSION}" --architecture "${arch}" --template "${template}" --no-cloud
            else
              unity-cli run --unity-editor "${UNITY_EDITOR_PATH}" -quit -createProject "${project_path}"
            fi
          }
          # prefer the built-in 3D template like v3 did; the CLI's "3d" means URP, which older editors don't offer
          template="3d"
          if [ "${major}" -ge 2019 ]; then
            # newer CLIs list templates with `unity templates`; older ones need `unity templates list`
            templates_json="$(unity templates --editor "${UNITY_EDITOR_VERSION}" --json || unity templates list --editor "${UNITY_EDITOR_VERSION}" --json || true)"
            echo "${templates_json}"
            template="$(printf '%s' "${templates_json}" | node -e '
              let input = ""; process.stdin.on("data", c => input += c).on("end", () => {
                let names = [];
                try { names = (JSON.parse(input).data || []).map(t => t.name || t.id).filter(Boolean); } catch {}
                const preferred = ["com.unity.template.3d", "com.unity.template.3d-cross-platform", "com.unity.template.universal", "com.unity.template.urp-blank"];
                // without a list, editors before 2022 still offer the built-in 3D template but not URP
                process.stdout.write(preferred.find(p => names.includes(p)) || (Number(process.argv[1]) < 2022 ? "com.unity.template.3d" : "3d"));
              });' "${major}")"
            echo "Using project template: ${template}"
          fi
          create_rc=1
          for attempt in 1 2 3; do
            echo "Create Unity Project attempt ${attempt}/3"
            if create_project; then
              create_rc=0
              break
            fi
            rm -rf "${project_path}"
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Creating the project failed on attempt ${attempt}; retrying after short backoff"
              sleep 10
            fi
          done
          if [ "$create_rc" -ne 0 ]; then
            echo "::error::Failed to create Unity project after 3 attempts"
            exit 1
          fi
          echo "UNITY_PROJECT_PATH=${project_path}" >> "$GITHUB_ENV"
      - name: Verify UNITY_PROJECT_PATH variable
        if: ${{ matrix.unity-version != 'none' }}
        id: verify-project-path
        run: |
          if [ -z "${UNITY_PROJECT_PATH}" ]; then
            echo "::error::UNITY_PROJECT_PATH is not set"
            exit 1
          fi
          # check if the project can be built. Only Unity 2019.4+ and newer majors support the build pipeline package
          version="${MATRIX_UNITY_VERSION}"
          # extract major and minor (minor may be empty if version is just '2019' etc.)
          major=$(echo "$version" | cut -d'.' -f1)
          minor=$(echo "$version" | cut -d'.' -f2)
          if [ -z "$minor" ]; then
            minor=0
          fi
          # numeric comparison: enable build for major >= 2019
          if [ "$major" -ge 2019 ]; then
            echo "Proceeding with build for Unity version $version"
            echo "RUN_BUILD=true" >> $GITHUB_OUTPUT
          else
            echo "Skipping build: Unity version $version does not support the build pipeline package (requires 2019.4+)"
          fi
      - name: Update Android Target Sdk Version
        if: ${{ matrix.build-target == 'Android' && matrix.unity-version != 'none' }}
        run: |
          # update AndroidTargetSdkVersion to 32 in ProjectSettings/ProjectSettings.asset
          sed -i 's/AndroidTargetSdkVersion: [0-9]*/AndroidTargetSdkVersion: 32/' "${UNITY_PROJECT_PATH}/ProjectSettings/ProjectSettings.asset"
          # ensure android dependencies are installed before UTP/build batches
          unity-cli setup-unity -p "${UNITY_PROJECT_PATH}" -m android
      - name: Disable WebGL Compression
        # Brotli on the .wasm takes minutes per build and the tests never serve the player, so it only costs job time
        if: ${{ matrix.build-target == 'WebGL' && matrix.unity-version != 'none' }}
        run: |
          set -euo pipefail
          path="${UNITY_PROJECT_PATH}/ProjectSettings/ProjectSettings.asset"
          # 0 is Brotli, 1 is Gzip and 2 is Disabled
          if grep -Eq '^[[:blank:]]*webGLCompressionFormat:' "${path}"; then
            # -i with a suffix works with both GNU and BSD sed
            sed -E -i.bak 's/^([[:blank:]]*)webGLCompressionFormat:.*$/\1webGLCompressionFormat: 2/' "${path}"
            rm -f "${path}.bak"
          else
            # the asset holds only the PlayerSettings document, whose keys sit two spaces in
            if [ -n "$(tail -c 1 "${path}")" ]; then
              printf '\n' >> "${path}"
            fi
            printf '  webGLCompressionFormat: 2\n' >> "${path}"
          fi
          grep 'webGLCompressionFormat' "${path}"
      - name: Compute safe artifact name
        id: artifact-name
        env:
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          unity_version="${MATRIX_UNITY_VERSION}"
          unity_version="${unity_version//'*'/x}"
          bt="${MATRIX_BUILD_TARGET}"
          bt="${bt:-none}"
          # Per-job slug so parallel matrix rows never collide (name encodes the job-builder row).
          base="${MATRIX_OS}-${unity_version}-${bt}"
          ba="${MATRIX_BUILD_ARGS}"
          if [ -n "${ba}" ]; then
            if command -v sha256sum >/dev/null 2>&1; then
              bah=$(printf '%s' "$ba" | sha256sum | awk '{print $1}' | cut -c1-12)
            else
              bah=$(printf '%s' "$ba" | shasum -a 256 2>/dev/null | awk '{print $1}' | cut -c1-12)
            fi
            base="${base}-ba${bah}"
          fi
          mname="${MATRIX_NAME:-}"
          if [ -n "$mname" ]; then
            slug=$(printf '%s' "$mname" | sed 's/[^a-zA-Z0-9._-]/_/g' | cut -c1-100)
            base="${slug}__${base}"
          fi
          echo "name=${base}-utp-batch-logs" >> $GITHUB_OUTPUT
        shell: bash
      - name: Run Unity UTP test batches
        if: ${{ steps.verify-project-path.outputs.RUN_BUILD == 'true' }}
        uses: ./.github/actions/run-unity-test-batch
        with:
          unity-project-path: ${{ env.UNITY_PROJECT_PATH }}
          build-target: ${{ matrix.build-target }}
          build-args: ${{ matrix.build-args }}
          test-profile: ${{ inputs.utp-test-profile }}
          artifact-name: ${{ steps.artifact-name.outputs.name }}
      - name: Verify UTP JSON keys
        if: ${{ steps.verify-project-path.outputs.RUN_BUILD == 'true' }}
        run: node .github/scripts/scan-utp-artifacts.cjs "${GITHUB_WORKSPACE}/utp-artifacts"
      - name: Guardrail hidden UTP failures
        if: ${{ steps.verify-project-path.outputs.RUN_BUILD == 'true' }}
        run: |
          set -euo pipefail
          # Keep this alternation in sync with hard failures from .github/actions/scripts/run-utp-tests.sh
          failure_markers='One or more tests did not meet expectations|was expected to succeed but failed|produced UTP errors but was expected to succeed|No \*-utp-json.log artifacts were produced|No UTP scenarios were executed'
          log_dir="${UNITY_PROJECT_PATH}/Builds/Logs"
          artifacts_dir="${GITHUB_WORKSPACE}/utp-artifacts"

          marker_found=0

          scan_markers() {
            local target_dir="$1"
            if command -v rg >/dev/null 2>&1; then
              rg -n --no-ignore -S "$failure_markers" "$target_dir"
            else
              grep -RInE "$failure_markers" "$target_dir"
            fi
          }

          if [ -d "$log_dir" ]; then
            if scan_markers "$log_dir"; then
              echo "::error::Hidden UTP failure marker detected in ${log_dir}"
              marker_found=1
            fi
          fi

          if [ -d "$artifacts_dir" ]; then
            if scan_markers "$artifacts_dir"; then
              echo "::error::Hidden UTP failure marker detected in ${artifacts_dir}"
              marker_found=1
            fi
          fi

          utp_count=0
          if [ -d "$log_dir" ]; then
            utp_count=$(find "$log_dir" -maxdepth 1 -type f -name '*-utp-json.log' 2>/dev/null | wc -l | tr -d ' ')
          fi
          if [ "${utp_count:-0}" -eq 0 ] && [ -d "$artifacts_dir" ]; then
            utp_count=$(find "$artifacts_dir" -type f -name '*-utp-json.log' 2>/dev/null | wc -l | tr -d ' ')
          fi
          if [ "${utp_count:-0}" -eq 0 ]; then
            echo "::error::RUN_BUILD=true but no *-utp-json.log found under Logs or utp-artifacts (possible false-green / harness abort)"
            exit 1
          fi

          if [ "$marker_found" -ne 0 ]; then
            exit 1
          fi
      - name: Print log paths
        if: ${{ matrix.unity-version != 'none' }}
        run: |
          LICENSING_CLIENT_LOG_PATH=$(unity-cli licensing-client-logs)
          LICENSING_AUDIT_LOG_PATH=$(unity-cli licensing-audit-logs)

          echo "Licensing Client Log Path: ${LICENSING_CLIENT_LOG_PATH}"
          echo "Licensing Audit Log Path: ${LICENSING_AUDIT_LOG_PATH}"

          if [ ! -f "${LICENSING_CLIENT_LOG_PATH}" ]; then
            echo "::error::Licensing Client log file does not exist at ${LICENSING_CLIENT_LOG_PATH}"
          fi

          if [ ! -f "${LICENSING_AUDIT_LOG_PATH}" ]; then
            echo "::error::Licensing Audit log file does not exist at ${LICENSING_AUDIT_LOG_PATH}"
          fi
      - name: Return License
        # macOS and Linux runners all report the same machine identity to Unity, so jobs share one activation and a
        # return revokes it for every other job; Windows runners are a new machine every job, so only they return
        if: ${{ always() && runner.os == 'Windows' }}
        run: unity-cli return-license --license personal
