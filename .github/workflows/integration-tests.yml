name: integration-tests
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  utp-batch-contract:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: UTP batch assertion helpers (contract)
        run: bash tests/run-utp-tests-contract.sh
  setup:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write # to publish unit test results via checks github api
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/
      - uses: RageAgainstThePixel/job-builder@v1
        id: setup-jobs
        with:
          build-options: ./.github/workflows/build-options.json
          # macOS and Linux rows share one license seat per OS and run all at once; each Windows row takes its own seat
          group-by: os
    outputs:
      jobs: ${{ steps.setup-jobs.outputs.jobs }}
  validate:
    if: ${{ needs.setup.outputs.jobs }}
    needs: setup
    name: build ${{ matrix.jobs.name }}
    permissions:
      contents: read
      checks: write # required by nested unity-build workflow
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.jobs) }}
      fail-fast: false
    secrets: inherit
    uses: ./.github/workflows/unity-build.yml
    with:
      matrix: ${{ toJSON(matrix.jobs.matrix) }}
      utp-test-profile: normal
      # the UNITY_WINDOWS_SEATS repo variable raises the Windows cap without a workflow change
      max-parallel: ${{ matrix.jobs.name == 'windows-latest' && fromJSON(vars.UNITY_WINDOWS_SEATS || '2') || 256 }}
  validate-negative-scenarios:
    if: github.event.pull_request.draft == false
    name: build negative-scenarios
    permissions:
      contents: read
      checks: write
    secrets: inherit
    uses: ./.github/workflows/unity-build.yml
    with:
      matrix: '{"include":[{"os":"ubuntu-latest","unity-version":"6000.1","build-target":"StandaloneLinux64","name":"negative-scenarios"}]}'
      utp-test-profile: negative
  # one check that stands for the whole run, so rows can be regrouped or renamed without touching required checks
  ci-result:
    needs: [utp-batch-contract, setup, validate, validate-negative-scenarios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              echo "::error::At least one job ended with ${result}"
              exit 1
            fi
          done
  timeline:
    needs: [setup, validate, validate-negative-scenarios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: Kesin11/actions-timeline@460b1f8a750077029ad3589824d371b200e91dcf # v3.2.1
        continue-on-error: true
