name: integration-tests
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: '0 8 1 * *' # monthly: the pre-Unity 6 editors, which no longer change
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
    inputs:
      editors:
        description: Which editors to test
        type: choice
        options: [unity-6-and-newer, legacy]
        default: unity-6-and-newer
concurrency:
  # the monthly legacy run gets its own group, so a push to main does not cancel it
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'legacy' || inputs.editors || 'unity-6-and-newer' }}
  cancel-in-progress: true
jobs:
  utp-batch-contract:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: UTP batch assertion helpers (contract)
        run: bash tests/run-utp-tests-contract.sh
  unit-tests:
    if: github.event.pull_request.draft == false
    name: unit-tests ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      # the CLI option tests run the linked unity-cli
      - run: npm run link
      - run: npm run tests
  setup:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write # to publish unit test results via checks github api
    env:
      LEGACY: ${{ github.event_name == 'schedule' || inputs.editors == 'legacy' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: ${{ env.LEGACY != 'true' }}
        with:
          node-version: 24.x
          cache: npm
      # pull requests and pushes test the streams the official CLI offers (the LTS lines, the current release, the
      # beta and the alpha), so a stream joins when Unity lists it and leaves when Unity stops; build-options.json keeps
      # the platform rows and the fallback list. The monthly run tests every major.minor line in build-options-legacy.json.
      - name: Unity streams
        id: streams
        if: ${{ env.LEGACY != 'true' }}
        shell: bash
        env:
          UNITY_NON_INTERACTIVE: '1'
          UNITY_NO_BANNER: '1'
          UNITY_NO_UPDATE_CHECK: '1'
        run: |
          set -euo pipefail
          options='./.github/workflows/build-options.json'
          generated="${RUNNER_TEMP}/build-options.json"
          # errexit does not apply inside a function called as a condition, so every step returns on failure itself
          list_streams() {
            npm ci --no-audit --no-fund > /dev/null || return 1
            npm run build > /dev/null || return 1
            # unity-cli installs the official CLI with SHA-256 verification; no license is needed to list releases
            local cli
            cli="$(node -e "require('./dist/index.js').UnityCli.Get().then(c => console.log(c.executable), e => { console.error(e); process.exit(1); })" | tail -n 1)" || return 1
            [ -n "${cli}" ] || return 1
            "${cli}" editors --releases --format json |
              jq -c '[.data.items[].version | select(test("^[0-9]+\\.[0-9]+\\.")) | capture("^(?<s>[0-9]+\\.[0-9]+)").s] | unique_by(split(".") | map(tonumber))'
          }
          if streams="$(list_streams)" && [ "$(jq 'length' <<< "${streams}")" -gt 0 ]; then
            jq --argjson streams "${streams}" '."unity-version" = $streams' "${options}" > "${generated}"
          else
            # a failed listing falls back to the file's own list rather than failing the step
            echo "::warning::Could not list Unity releases, testing the fallback streams"
            cp "${options}" "${generated}"
          fi
          echo "Testing Unity streams: $(jq -r '."unity-version" | join(", ")' "${generated}")"
          echo "path=${generated}" >> "${GITHUB_OUTPUT}"
      - uses: RageAgainstThePixel/job-builder@v1
        id: setup-jobs
        with:
          build-options: ${{ env.LEGACY == 'true' && './.github/workflows/build-options-legacy.json' || steps.streams.outputs.path }}
          # one group per editor version; every group runs at once, since macOS and Linux rows share one seat per OS
          # and Windows rows return theirs
          group-by: unity-version
    outputs:
      jobs: ${{ steps.setup-jobs.outputs.jobs }}
  # One sign-in per OS for the whole run. macOS and Linux runners share one machine identity, so the license activated
  # here serves every macOS or Linux row of this run, which then needs no sign-in of its own. It is passed on encrypted,
  # because artifacts of a public repository can be downloaded by anyone, and it is never returned: a return would
  # revoke it for every job on that identity, other repositories' included. license-cleanup deletes it after the run.
  license:
    if: github.event.pull_request.draft == false
    name: license ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Setup unity-cli
        run: |
          npm ci
          npm run build
          npm run link
      - name: Activate License
        id: activate
        shell: bash
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # the encryption key comes from a random token, never the account password, so the public artifact gives
          # nobody a way to test password guesses offline
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${UNITY_USERNAME}" ] || [ -z "${UNITY_PASSWORD}" ] || [ -z "${CI_TOKEN}" ]; then
            # pull requests from forks get no secrets; their rows fall back to their own activation
            echo '::warning::No Unity credentials or CI_TOKEN, so this run has no shared license'
            exit 0
          fi
          unity-cli upm-install --json
          # activates before anything else installs the licensing client, as a fresh runner without the Hub does
          # for downstream actions; license-context runs after, only to explain a failure
          code=0
          unity-cli activate-license --license personal || code=$?
          if [ "${code}" -ne 0 ]; then
            unity-cli license-context || true
            exit "${code}"
          fi
          dir="${RUNNER_TEMP}/unity-license"
          mkdir -p "${dir}"
          license_file="$(unity-cli license-file-path)"
          # the key never reaches a command line: openssl reads it from the environment
          export LICENSE_KEY="${CI_TOKEN}:${GITHUB_RUN_ID}"
          if ! openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "${license_file}" -out "${dir}/unity-license.enc" -pass env:LICENSE_KEY; then
            echo 'Could not encrypt the run license' >&2
            exit 1
          fi
          echo "encrypted=true" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v7
        if: ${{ steps.activate.outputs.encrypted == 'true' }}
        with:
          name: unity-license-${{ runner.os }}
          path: ${{ runner.temp }}/unity-license/unity-license.enc
          retention-days: 1
          if-no-files-found: error
  validate:
    # the rows still run when the license job fails, and activate with the account instead
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.setup.outputs.jobs }}
    needs: [setup, license]
    name: build ${{ matrix.jobs.name }}
    permissions:
      contents: read
      checks: write # required by nested unity-build workflow
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.jobs) }}
      fail-fast: false
    secrets: inherit
    uses: ./.github/workflows/unity-build.yml
    with:
      matrix: ${{ toJSON(matrix.jobs.matrix) }}
      utp-test-profile: normal
      # the legacy set tests 4.x through 2018 on purpose, and Unity labels those with a Security Alert
      allow-security-alert: ${{ github.event_name == 'schedule' || inputs.editors == 'legacy' }}
  validate-negative-scenarios:
    if: ${{ !cancelled() && github.event.pull_request.draft == false && github.event_name != 'schedule' && inputs.editors != 'legacy' }}
    needs: license
    name: build negative-scenarios
    permissions:
      contents: read
      checks: write
    secrets: inherit
    uses: ./.github/workflows/unity-build.yml
    with:
      matrix: '{"include":[{"os":"ubuntu-latest","unity-version":"6000.3","build-target":"StandaloneLinux64","name":"negative-scenarios"}]}'
      utp-test-profile: negative
  # one check that stands for the whole run, so rows can be regrouped or renamed without touching required checks
  ci-result:
    needs: [utp-batch-contract, unit-tests, setup, validate, validate-negative-scenarios]
    # skipped with the rest on a draft, rather than green with nothing tested
    if: ${{ always() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SETUP_RESULT: ${{ needs.setup.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              echo "::error::At least one job ended with ${result}"
              exit 1
            fi
          done
          # the matrix must actually have run: an empty or skipped matrix would otherwise pass with no tests
          if [ "${SETUP_RESULT}" != "success" ] || [ "${VALIDATE_RESULT}" != "success" ]; then
            echo "::error::No Unity rows ran (setup: ${SETUP_RESULT}, validate: ${VALIDATE_RESULT})"
            exit 1
          fi
  license-cleanup:
    needs: [license, validate, validate-negative-scenarios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # to delete this run's license artifacts
    steps:
      - name: Delete the run license
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.name | startswith("unity-license-")) | .id')"; then
            echo 'Could not list the run artifacts' >&2
            exit 1
          fi
          count=0
          for id in ${ids}; do
            if ! gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"; then
              echo "Could not delete artifact ${id}" >&2
              exit 1
            fi
            count=$((count + 1))
          done
          echo "Deleted ${count} license artifacts"
  timeline:
    needs: [setup, validate, validate-negative-scenarios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: Kesin11/actions-timeline@460b1f8a750077029ad3589824d371b200e91dcf # v3.2.1
        continue-on-error: true
