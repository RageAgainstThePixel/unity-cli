name: unity-release-discovery
on:
  schedule:
    - cron: '0 7 * * 1' # weekly Monday 07:00 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Discover Unity releases vs matrix
        env:
          OPEN_ISSUE: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/unity-release-discovery.cjs
